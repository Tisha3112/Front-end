<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 400px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="main">
        <img src="https://images.pexels.com/photos/33430991/pexels-photo-33430991.jpeg?_gl=1*18r1neo*_ga*MjIxMjM1OTA3LjE3NTAxNjQxODA.*_ga_8JE65Q40S6*czE3NjIzMzQ0MDIkbzEzJGcxJHQxNzYyMzM0NDc5JGo0NiRsMCRoMA.." height="100%" width="100%" class="img" alt="">
        <img src="https://images.pexels.com/photos/27966251/pexels-photo-27966251.jpeg" height="100%" width="100%" class="img" alt="">
        <img src="https://images.pexels.com/photos/27151836/pexels-photo-27151836.jpeg" height="100%" width="100%" class="img"  alt="">
        <img src="https://images.pexels.com/photos/15989833/pexels-photo-15989833.jpeg" height="100%" width="100%" class="img" alt="">
    </div>


    <script>
        let img_tag = document.getElementsByClassName("img")
        console.log(img_tag)

        let index = 0

        function slider(){

            // hide 
            for(let i=0;i<img_tag.length;i++){
                img_tag[i].style.display = "none";
                // console.log(img_tag[i])
            }
            // show at 
            img_tag[index].style.display = "block"
            index++;

            if(index == 4){
                index = 0
            }

            setTimeout(slider,1000)
        }
        slider()

    </script>
</body>

</html>
