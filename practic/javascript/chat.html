<!DOCTYPE html>
<html lang="en">
<head>

    overflow: hidden;
    transition: transform 0.3s ease;
  }

  .form-wrapper:hover {
    transform: translateY(-3px);
  }

  /* Header */
  .form-header {
    background: linear-gradient(135deg, #555, #888);
    color: #fff;
    text-align: center;
    padding: 35px 20px;
    border-bottom-left-radius: 25px;
    border-bottom-right-radius: 25px;
  }

  .form-header h2 {
    font-size: 28px;
    margin-bottom: 5px;
  }

  .form-header p {
    font-size: 14px;
    color: #ddd;
  }

  /* Form Body */
  .form-body {
    padding: 35px 30px;
  }

  .input-group {
    position: relative;
    margin-bottom: 20px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 20px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
    transition: 0.3s;
    background: #f7f7f7;
  }

  .input-group input:focus {
    border-color: #555;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
    outline: none;
    background: #fff;
  }

  .input-group label {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.95);
    padding: 0 5px;
    color: #777;
    font-size: 14px;
    pointer-events: none;
    transition: 0.3s;
  }

  .input-group input:not(:placeholder-shown) + label {
    top: -10px;
    left: 15px;
    font-size: 12px;
    color: #555;
  }

  small.text-danger {
    color: #d32f2f;
  }

    width: 100%;

<body>

<div class="form-wrapper">

        <div class="col-md-6 input-group">
          <input type="date" id="checkout" placeholder=" " required />
          <label><i class="fas fa-calendar-day"></i> Check-Out</label>
          <small id="checkoutError"></small>

        <div class="col-md-6 input-group">
          <input type="number" id="adults" placeholder=" " min="1" required />
          <label><i class="fas fa-users"></i> Adults</label>
        </div>
        <div class="col-md-6 input-group">
          <input type="number" id="children" placeholder=" " min="0" required />
          <label><i class="fas fa-child"></i> Children</label>
        </div>
        <div class="col-md-12 input-group">

<div class="table-wrapper">
  <h4><i class="fas fa-list"></i> Booking Records</h4>

    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Aadhar</th>
        <th>Check-In</th>
        <th>Check-Out</th>
      </tr>
    </thead>
    <tbody id="records"></tbody>
  </table>
</div>

<script>
const form = document.getElementById("bookingForm");
const recordsTable = document.getElementById("records");
let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

renderTable();

form.addEventListener("submit", function(e) {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const aadhar = document.getElementById("aadhar").value.trim();
  const address = document.getElementById("address").value.trim();
  const checkin = document.getElementById("checkin").value;
  const checkout = document.getElementById("checkout").value;
  const purpose = document.getElementById("purpose").value.trim();

  let valid = true;
  document.querySelectorAll("small").forEach(el => el.textContent="");

  if(!name){ document.getElementById("nameError").textContent="Name required"; valid=false; }
  if(!/^[6-9]\d{9}$/.test(phone)){ document.getElementById("phoneError").textContent="Invalid phone"; valid=false; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ document.getElementById("emailError").textContent="Invalid email"; valid=false; }
  if(!/^\d{12}$/.test(aadhar)){ document.getElementById("aadharError").textContent="Enter 12 digit Aadhar"; valid=false; }

  if(!checkin){ document.getElementById("checkinError").textContent="Check-in required"; valid=false; }
  if(!checkout){ document.getElementById("checkoutError").textContent="Check-out required"; valid=false; }
  if(checkin && checkout && new Date(checkout)<=new Date(checkin)){ document.getElementById("checkoutError").textContent="Check-out after check-in"; valid=false; }
  if(!purpose){ document.getElementById("purposeError").textContent="Purpose required"; valid=false; }
  if(!valid) return;

  const booking = {id: bookings.length + 1, name, phone, email, aadhar, checkin, checkout};
  bookings.push(booking);
  localStorage.setItem("bookings", JSON.stringify(bookings));
  renderTable();
  form.reset();
});

function renderTable(){
  recordsTable.innerHTML = "";
  bookings.forEach(b=>{
    recordsTable.innerHTML += `<tr>
      <td>${b.id}</td>
      <td>${b.name}</td>
      <td>${b.phone}</td>
      <td>${b.email}</td>
      <td>${b.aadhar}</td>
      <td>${b.checkin}</td>
      <td>${b.checkout}</td>
    </tr>`;
  });
}
</script>
