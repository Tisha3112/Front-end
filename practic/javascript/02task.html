<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Operators Lab</title>
</head>
<body>

<h2>Open Console to See the Output</h2>

<script>
    // Declare two numbers
    let a = 15;
    let b = 5;

    // ✅ 1. Arithmetic Operations
    console.log("Arithmetic Operations:");
    console.log("a = " + a + ", b = " + b);
    console.log("Addition (a + b) = " + (a + b));
    console.log("Subtraction (a - b) = " + (a - b));
    console.log("Multiplication (a * b) = " + (a * b));
    console.log("Division (a / b) = " + (a / b));

    // ✅ 2. Comparison Operations
    console.log("\nComparison Operations:");
    console.log("Is a equal to b? " + (a === b));
    console.log("Is a greater than b? " + (a > b));
    console.log("Is a less than or equal to b? " + (a <= b));

    // ✅ 3. Logical Operations
    console.log("\nLogical Operations:");
    console.log("Is a > 10 AND b < 10? " + (a > 10 && b < 10));
    console.log("Is a < 10 OR b < 10? " + (a < 10 || b < 10));
    console.log("NOT (a > b): " + !(a > b));
</script>

</body>
</html>
