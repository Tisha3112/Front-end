<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Table Calculator</title>
<style>
    body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f4f4f4;
  font-family: Arial, sans-serif;
}

.calculator {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
}

table {
  width: 100%;
}

input#display {
  width: 100%;
  height: 50px;
  font-size: 24px;
  text-align: right;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  width: 100%;
  padding: 20px;
  font-size: 18px;
  border: none;
  background: #e0e0e0;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover {
  background: #d0d0d0;
}

button.equal {
  background-color: #4CAF50;
  color: white;
  font-weight: bold;
}

</style>
</head>
<body>
  <div class="calculator">
    <table>
      <tr>
        <td colspan="4">
          <input type="text" id="display" disabled />
        </td>
      </tr>
      <tr>
        <td><button onclick="clearDisplay()">C</button></td>
        <td><button onclick="appendValue('7')">7</button></td>
        <td><button onclick="appendValue('8')">8</button></td>
        <td><button onclick="appendValue('9')">9</button></td>
      </tr>
      <tr>
        <td><button onclick="appendValue('/')">/</button></td>
        <td><button onclick="appendValue('4')">4</button></td>
        <td><button onclick="appendValue('5')">5</button></td>
        <td><button onclick="appendValue('6')">6</button></td>
      </tr>
      <tr>
        <td><button onclick="appendValue('*')">*</button></td>
        <td><button onclick="appendValue('1')">1</button></td>
        <td><button onclick="appendValue('2')">2</button></td>
        <td><button onclick="appendValue('3')">3</button></td>
      </tr>
      <tr>
        <td><button onclick="appendValue('-')">-</button></td>
        <td><button onclick="appendValue('0')">0</button></td>
        <td><button onclick="appendValue('.')">.</button></td>
        <td><button onclick="appendValue('+')">+</button></td>
      </tr>
      <tr>
        <td colspan="4"><button class="equal" onclick="calculateResult()">=</button></td>
      </tr>
    </table>
  </div>
  <script>
    function appendValue(value) {
  document.getElementById('display').value += value;
}

function clearDisplay() {
  document.getElementById('display').value = '';
}

function calculateResult() {
  try {
    const result = eval(document.getElementById('display').value);
    document.getElementById('display').value = result;
  } catch {
    alert('Invalid expression');
  }
}

  </script>
</body>
</html>
