<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Lightbox Gallery</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f9f9f9;
      font-family: Arial, sans-serif;
    }

    h2 {
      text-align: center;
      margin: 30px 0;
      font-weight: bold;
      color: #333;
    }

    /* Gallery image style */
    .gallery-img {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border-radius: 10px;
    }

    .gallery-img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    /* Modal image style */
    #lightbox-img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .modal-content {
      background: transparent;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Bootstrap Lightbox Image Gallery</h2>
    
    <!-- Bootstrap Grid Gallery -->
    <div class="row g-4">
      <div class="col-md-4 col-sm-6">
        <img src="https://picsum.photos/id/1015/600/400" class="img-fluid gallery-img" alt="Gallery Image 1">
      </div>
      <div class="col-md-4 col-sm-6">
        <img src="https://picsum.photos/id/1016/600/400" class="img-fluid gallery-img" alt="Gallery Image 2">
      </div>
      <div class="col-md-4 col-sm-6">
        <img src="https://picsum.photos/id/1018/600/400" class="img-fluid gallery-img" alt="Gallery Image 3">
      </div>
      <div class="col-md-4 col-sm-6">
        <img src="https://picsum.photos/id/1020/600/400" class="img-fluid gallery-img" alt="Gallery Image 4">
      </div>
      <div class="col-md-4 col-sm-6">
        <img src="https://picsum.photos/id/1021/600/400" class="img-fluid gallery-img" alt="Gallery Image 5">
      </div>
      <div class="col-md-4 col-sm-6">
        <img src="https://picsum.photos/id/1024/600/400" class="img-fluid gallery-img" alt="Gallery Image 6">
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content text-center">
        <img id="lightbox-img" src="" alt="Lightbox Image">
      </div>
    </div>
  </div>

  <!-- Bootstrap JS & jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom jQuery -->
  <script>
    $(document).ready(function() {
      // When gallery image is clicked
      $(".gallery-img").click(function() {
        let imgSrc = $(this).attr("src");  // Get the clicked image source
        $("#lightbox-img").attr("src", imgSrc);  // Set it inside modal
        $("#lightboxModal").modal("show");  // Show modal
        console.log("Image opened in Lightbox:", imgSrc); // Print in console
      });
    });
  </script>

</body>
</html>
