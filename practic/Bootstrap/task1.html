<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Lightbox Gallery</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Lightbox CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    h2 {
      text-align: center;
      margin: 30px 0;
      font-weight: bold;
      color: #333;
    }
    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s ease-in-out;
      cursor: pointer;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Heading -->
  <div class="container">
    <h2>Bootstrap Lightbox Image Gallery</h2>
    
    <!-- Gallery Section -->
    <div class="row gallery">
      <!-- Image 1 -->
      <div class="col-md-4 mb-4">
        <a href="https://picsum.photos/id/1015/800/600" data-lightbox="gallery" data-title="Beautiful Landscape 1">
          <img src="https://picsum.photos/id/1015/400/300" class="img-fluid" alt="Gallery Image 1">
        </a>
      </div>
      
      <!-- Image 2 -->
      <div class="col-md-4 mb-4">
        <a href="https://picsum.photos/id/1016/800/600" data-lightbox="gallery" data-title="Beautiful Landscape 2">
          <img src="https://picsum.photos/id/1016/400/300" class="img-fluid" alt="Gallery Image 2">
        </a>
      </div>
      
      <!-- Image 3 -->
      <div class="col-md-4 mb-4">
        <a href="https://picsum.photos/id/1025/800/600" data-lightbox="gallery" data-title="Beautiful Landscape 3">
          <img src="https://picsum.photos/id/1025/400/300" class="img-fluid" alt="Gallery Image 3">
        </a>
      </div>

      <!-- Image 4 -->
      <div class="col-md-4 mb-4">
        <a href="https://picsum.photos/id/1021/800/600" data-lightbox="gallery" data-title="Beautiful Landscape 4">
          <img src="https://picsum.photos/id/1021/400/300" class="img-fluid" alt="Gallery Image 4">
        </a>
      </div>

      <!-- Image 5 -->
      <div class="col-md-4 mb-4">
        <a href="https://picsum.photos/id/1003/800/600" data-lightbox="gallery" data-title="Beautiful Landscape 5">
          <img src="https://picsum.photos/id/1003/400/300" class="img-fluid" alt="Gallery Image 5">
        </a>
      </div>

      <!-- Image 6 -->
      <div class="col-md-4 mb-4">
        <a href="https://picsum.photos/id/1002/800/600" data-lightbox="gallery" data-title="Beautiful Landscape 6">
          <img src="https://picsum.photos/id/1002/400/300" class="img-fluid" alt="Gallery Image 6">
        </a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Lightbox JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>

  <!-- Custom jQuery -->
  <script>
    $(document).ready(function () {
      // Example: Alert when image is clicked
      $(".gallery img").on("click", function () {
        console.log("Image clicked:", $(this).attr("alt")); 
      });
    });
  </script>

</body>
</html>
