<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>variable 2 const</title>
  </head>
  <body>
    <b id="country"></b>
    <br />
    <i id="name"></i>
    <script>
      const country = "india";
      const name = "tishu";
      document.getElementById("country").innerHTML = country;
      document.getElementById("name").innerHTML = name;
    </script>
  </body>
</html>
