<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .icon{
        margin: 50px;
        transition: 5s;
        }

        .icon i{
            color: #fff;
            background-color: black;
            padding: 20px;
            font-size: 30px;
            transform: scale(1.5);
        }
        .icon:hover i{
            background-color: aquamarine;
        }

      .main {
        margin: 50px auto;
        width: 600px;
        height: 400px;
        background: url(https://p.w3layouts.com/demos_new/template_demo/20-06-2017/elite_shoppy-demo_Free/1660570665/web/images/bot_1.jpg);
        position: relative;
        overflow: hidden;
      }
      h2 {
        color: #fff;
        font-size: 36px;
        letter-spacing: 14px;
        text-align: center;
        line-height: 400px;
      }
      span {
        color: aqua;
      }

      .right {
        position: absolute;
        width: 600px;
        height: 400px;
        background: rgba(0, 0, 0, 0.4);
        right: -100%;
        top: -100%;
        transition: 3s;
      }
      .left {
        position: absolute;
        width: 600px;
        height: 400px;
        background: rgba(0, 0, 0, 0.4);
        left: -100%;
        bottom: -100%;
        transition: 3s;
      }
      .main:hover .right {
        right: 0;
        top: 0;
      }

      .main:hover .left {
        left: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <h2>Flat <span>50%</span>Offer</h2>
      <div class="right"></div>
      <div class="left"></div>
    </div>

    <div class="icon">
        <i class="fa-solid fa-house"></i>
    </div>
  </body>
</html>
