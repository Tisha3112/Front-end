<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Menu</title>
    <link rel="stylesheet" href="website.css" />
    <style>

/* Navigation Bar Styling */
nav .ul {
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  background-color: #000;
  padding: 25px;
}

nav .ul .li {
  position: relative;
  list-style: none;
}

/* Underline animation for the first list item */
.li:first-child::after {
  position: absolute;
  content: "";
  width: 100%;
  height: 5px;
  background-color: #2fdab8;
  bottom: -25px;
  left: 0;
  transition: 1s;
}

/* Default underline effect for all list items */
.li::after {
  position: absolute;
  content: "";
  width: 0%;
  height: 5px;
  background-color: #2fdab8;
  bottom: -10px;
  left: 0;
  transition: 0.5s;
}


.li:hover::after {
  width: 100%;
}

/* Dropdown menu hidden by default */
.list {
  top: 100%;
  margin-top: 25px;
  box-shadow: 0 0 10px 0 #dfdede;
  z-index: 2;
  opacity: 0;
  transition: 1s;
  position: absolute;
  background-color: #fff;
  pointer-events: none;
}

/* Show dropdown on hover */
.dropdown:hover .list {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* Items inside dropdown list */
.nav-list li {
  list-style: none;
  color: #000;
  padding: 6px;
  transition: 2s;
  cursor: pointer;
}

/* Hover color change */
.nav-list li:hover {
  color: #2fdab8;
}


    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul class="ul">
          <li class="li"><a href="">Home</a></li>
          <li class="li"><a href="">About</a></li>
          <li class="li dropdown">
            <a href="" class="icon">
              Men's Wear <i class="fa-solid fa-angle-down"></i>
            </a>
            <div class="list">
              <img src="https://p.w3layouts.com/demos_new/template_demo/20-09-2020/tutee-liberty-demo_Free/448738053/web/images/top2.jpg"
                alt=""
              />
              <ul class="nav-list">
                <li>Clothing</li>
                <li>Wallets</li>
                <li>Footwear</li>
                <li>Watches</li>
                <li>Accessories</li>
                <li>Bags</li>
                <li>Caps & Hats</li>
              </ul>
              <ul class="nav-list">
                <li>Clothing</li>
                <li>Wallets</li>
                <li>Footwear</li>
              </ul>
            </div>
          </li>
          <li class="li">
            <a href="" class="icon">
              Women's Wear <i class="fa-solid fa-angle-down"></i>
            </a>
          </li>
          <li class="li">
            <a href="" class="icon">
              Short Codes <i class="fa-solid fa-angle-down"></i>
            </a>
          </li>
          <li class="li"><a href="">Contact</a></li>
        </ul>
      </nav>
    </header>

    <div class="img">

  </body>
</html>
