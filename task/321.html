<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Style Product Card</title>
  <style>
    table {
      width: 250px;
      height: 420px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      font-family: Arial, sans-serif;
      margin: 30px auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      perspective: 1000px;
      background-color: #fff;
    }

    table:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    /* Image Box/Card */
    .image-box {
      width: 100%;
      height: 240px;
      background: #f7f7f7;
      border: 1px solid #e0e0e0;
      border-radius: 8px 8px 0 0;
      padding: 5px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 1s ease;
      transform-style: preserve-3d;
      border-radius: 6px;
    }

    table:hover .image-box img {
      transform: rotateY(360deg);
    }

    td {
      padding: 0;
    }

    .content {
      padding: 12px;
    }

    h3 {
      font-size: 16px;
      margin: 0 0 8px;
      color: #0f1111;
      line-height: 1.3;
      height: 40px;
      overflow: hidden;
    }

    p {
      font-size: 13px;
      color: #565959;
      margin: 0 0 8px;
      height: 36px;
      overflow: hidden;
    }

    .price {
      font-size: 16px;
      font-weight: 600;
      color: #B12704;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <td colspan="2">
        <!-- Image Card Box -->
        <div class="image-box">
          <img src="https://tse3.mm.bing.net/th/id/OIP.PDtn7gZ55ZXmogPCJD29fgHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Product Image">
        </div>
      </td>
    </tr>
    <tr>
      <td colspan="2" class="content">
        <h3>Smart Wireless Headphones</h3>
        <p>High-quality wireless headphones with noise cancellation and long battery life.</p>
        <div class="price">₹2,499</div>
      </td>
    </tr>
  </table>

</body>
</html>
