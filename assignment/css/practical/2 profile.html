<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 profile</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .box {
        box-shadow: 0 0 8px 0;
        text-align: center;
        margin: 200px auto;
        width: 300px;
        padding: 30px;
        border-radius: 10%;
      }
      button {
        padding: 8px 20px;
        background-color: rgb(196, 222, 0);
        color: #fff;
        font-size: 18px;
        border: none;
        cursor: pointer;
        border-radius: 8px;
      }
      button:hover {
        background-color: rgb(200, 81, 140);
      }

      img {
        box-sizing: content-box;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img
        src="/WhatsApp Image 2025-07-25 at 17.51.12_0273ae95.jpg"
        alt=""
        width="100px"
      />
      <h1>TISHA PATEL</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus
        qui nisi nulla minus placeat laudantium!
      </p>
      <button>Add</button>
    </div>
  </body>
</html>
