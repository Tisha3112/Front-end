<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04 Grid Layout</title>
    <style>
      .main {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 20px;
        margin: 50px;
      }
      .card {
        box-shadow: 0 0 10px; 
        background-color: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        transition: 0.3s;
        padding: 20px;
        text-align: center;
      }
      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 0 14px rgba(0, 0, 0, 0.9);
      }

      .card-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap:40px;
        margin: 50px 0;
      }

      img {
        width: 100%;
        height: 150px;
        object-fit: contain;
        margin-bottom: 10px;
      }

      h2 {
        font-size: 26px;
        font-weight: 900;
      }

      span {
        font-size: 18px;
        color:red;
        font-weight: 700;
      }

      @media only screen and (max-width: 768px) {
        .main {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media only screen and (max-width: 576px) {
        .main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="card">
        <div class="card-content">
        <div class="img">
        <img
          src="https://tse1.mm.bing.net/th/id/OIP.jAkRndO3vHshPxTpk2E44gHaJW?pid=Api&P=0&h=180"
          alt=""
        />
        </div>
        <div class="card-info">

        </div>
        </div>
      </div>
