<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>03 Flexbox Layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header,
      footer {
        background-color: #8bc68d;
        color: white;
        padding: 30px;
        text-align: center;
      }

      .container {
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        padding: 10px;
        background: #ffffff;
        gap: 10px;
      }

      .sidebar {
        background-color: #f984bb;
        color: white;
        padding: 40px;
        flex: 1;
      }

      .main-content {
        background-color: #ace7e9;
        padding: 30px;
        flex: 3;
        color: #dd478d;
      }
    </style>
  </head>
  <body>
    <header>Header</header>

    <div class="container">
      <aside class="sidebar">Sidebar</aside>
      <main class="main-content">Main Content</main>
    </div>

    <footer>Footer</footer>
  </body>
</html>
